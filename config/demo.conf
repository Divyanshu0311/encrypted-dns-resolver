# Demo configuration: forwarding over the public resolvers, local records, ad blocking,
# abuse protection switched on, and the admin page on http://127.0.0.1:8080/
# Run from the repository root:  ./tools/make_demo_cert.sh && ./build/local/dns_server config/demo.conf

mode = forwarding
upstreams = 8.8.8.8:53, 1.1.1.1:53

# printer.lan, nas.lan, ... answered locally (try them in the Lookup test)
records_file = config/demo.hosts
# ad and tracker domains answered REFUSED
blocked_domains_file = config/blocked_domains.txt

workers = 4
queue_capacity = 1024
request_timeout_ms = 2000
lb_policy = least_outstanding
failure_threshold = 3
cooldown_ms = 3000

# low enough that the Abuse test trips it, high enough for one person browsing
rate_limit_qps = 200
rate_limit_burst = 100
block_rate_limit_strikes = 50
block_protocol_strikes = 100
block_window_ms = 10000
block_duration_ms = 60000

log_level = info

# 853 needs root, so the demo listens on 8853:  kdig +tls @127.0.0.1 -p 8853 example.com
listen = 127.0.0.1:8853
tls_cert = config/server.pem
tls_key = config/server.key

admin_listen = 127.0.0.1:8080
admin_ui_dir = gui
