# dns-middleware example configuration.
# Format: one `key = value` per line. Lines starting with '#' are comments.

# Operating mode: forwarding (send queries to upstreams) or recursive.
mode = forwarding

# Comma-separated upstream resolvers: 1.1.1.1, 1.1.1.1:53, [2606:4700::1111]:53. Port defaults to 53.
upstreams = 1.1.1.1:53, 8.8.8.8:53

# Optional static records file, answered before the upstreams. Must exist if set.
records_file = config/records.txt

# Number of worker threads processing queries.
workers = 4

# Per-worker queue size; when every worker's queue is full new queries get SERVFAIL.
queue_capacity = 1024

# Milliseconds before an unanswered request gets SERVFAIL (50-30000).
request_timeout_ms = 2000

# How queries are spread over workers: round_robin, least_outstanding or power_of_two.
lb_policy = round_robin

# Consecutive failures before a worker's circuit breaker opens.
failure_threshold = 3

# Milliseconds an open breaker refuses work before one probe query is let through.
cooldown_ms = 5000

# Sustained queries per second allowed per client address (0 disables the limiter).
rate_limit_qps = 1000

# Maximum burst size (token bucket capacity) for the rate limiter.
rate_limit_burst = 200

# Log verbosity: debug, info, warn or error.
log_level = info
