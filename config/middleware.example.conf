# dns-middleware example configuration.
# Format: one `key = value` per line. Lines starting with '#' are comments.

# Operating mode: forward queries to upstreams, or answer from records_file.
mode = forward

# Comma-separated list of upstream resolvers as host:port.
upstreams = 1.1.1.1:53, 8.8.8.8:53

# Path to the static records file (used when answering locally).
records_file = config/records.txt

# Number of worker threads processing queries.
workers = 4

# Maximum number of pending requests in the work queue before new ones are rejected.
queue_capacity = 1024

# Time in milliseconds before an in-flight request is abandoned.
request_timeout_ms = 2000

# Upstream selection policy for the load balancer (e.g. round_robin).
lb_policy = round_robin

# Consecutive failures before an upstream is marked unhealthy.
failure_threshold = 3

# Time in milliseconds an unhealthy upstream is skipped before being retried.
cooldown_ms = 5000

# Sustained queries per second allowed by the rate limiter.
rate_limit_qps = 1000

# Maximum burst size (token bucket capacity) for the rate limiter.
rate_limit_burst = 200

# Log verbosity: debug, info, warn or error.
log_level = info
