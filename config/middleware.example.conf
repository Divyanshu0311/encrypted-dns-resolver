# dns-middleware example configuration.
# Format: one `key = value` per line. Lines starting with '#' are comments.

# Operating mode: forwarding (send queries to upstreams) or recursive.
mode = forwarding

# Comma-separated upstream resolvers: 1.1.1.1, 1.1.1.1:53, [2606:4700::1111]:53. Port defaults to 53.
upstreams = 1.1.1.1:53, 8.8.8.8:53

# Optional static records file, answered before the upstreams. Must exist if set.
records_file = config/records.txt

# Number of worker threads processing queries.
workers = 4

# Per-worker queue size; when every worker's queue is full new queries get SERVFAIL.
queue_capacity = 1024

# Milliseconds before an unanswered request gets SERVFAIL (50-30000).
request_timeout_ms = 2000

# How queries are spread over workers: round_robin, least_outstanding or power_of_two.
lb_policy = round_robin

# Consecutive failures before a worker's circuit breaker opens.
failure_threshold = 3

# Milliseconds an open breaker refuses work before one probe query is let through.
cooldown_ms = 5000

# Sustained queries per second allowed per client address (0 disables the limiter).
rate_limit_qps = 1000

# Maximum burst size (token bucket capacity) for the rate limiter.
rate_limit_burst = 200

# Rate-limited queries from one source, within block_window_ms, before it is blocked (0 disables).
# Only counts while the rate limiter is on. Try 5.
block_rate_limit_strikes = 0

# Front-end offences (bad frames, failed TLS handshakes, malformed queries) before a block (0 disables).
# Must be higher than block_rate_limit_strikes when both are set. Try 20.
block_protocol_strikes = 0

# Milliseconds a strike is remembered (100-3600000).
block_window_ms = 10000

# Milliseconds a block lasts; blocked sources are disconnected before the TLS handshake (1000-604800000).
block_duration_ms = 300000

# Most sources tracked at once (1-10000000). IPv4 per address, IPv6 per /64. When full, new sources are ignored.
block_max_entries = 100000

# Log verbosity: debug, info, warn or error.
log_level = info

# ---- DNS-over-TLS front end ----

# Address and port to accept DoT connections on. [::] also accepts IPv4. Port defaults to 853.
listen = 0.0.0.0:853

# PEM certificate chain and private key. Set both or neither; both must exist. Keep the key chmod 600.
# tls_cert = config/server.pem
# tls_key = config/server.key

# Most client connections open at once (1-100000).
max_connections = 1000

# Most connections from one source (0-100000, 0 = no limit). IPv4 per address, IPv6 per /64.
# Raise it if many clients share one address behind NAT.
max_connections_per_source = 32

# Milliseconds without a whole query, including an unfinished TLS handshake, before a connection is closed
# (1000-300000). Also how long answers may sit unread before a client that stopped reading is reset.
idle_timeout_ms = 10000

# Optional file of domains answered with REFUSED, one per line. Must exist if set.
# blocked_domains_file = config/blocked_domains.txt
